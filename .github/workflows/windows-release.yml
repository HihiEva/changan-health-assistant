name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build:win -- --config.directories.output=release
      - name: Install and launch Windows app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*-Setup.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'ChangAn-installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node desktop/windows-smoke.cjs "$installDir/ChangAn.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ChangAn-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "常安 $tag · 个人档案与附件聊天" --notes-file RELEASE_NOTES.md }
          gh release upload $tag release/*.exe release/SHA256SUMS.txt --clobber
