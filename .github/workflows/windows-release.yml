name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build:win
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem ../windows-app/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content ../windows-app/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ChangAn-Windows-x64
          path: |
            ../windows-app/*.exe
            ../windows-app/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "常安 $tag · Windows 体验原型" --notes-file RELEASE_NOTES.md }
          gh release upload $tag ../windows-app/*.exe ../windows-app/SHA256SUMS.txt --clobber
